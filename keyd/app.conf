# Terminal overrides: Cmd+C/V/X need Ctrl+Shift+C/V/X in terminals
# Wayland reports org.kde.konsole (normalized to org-kde-konsole), X11 reports konsole
[konsole]

mac.c = C-S-c
mac.v = C-S-v
mac.x = C-S-x

[org-kde-konsole]

mac.c = C-S-c
mac.v = C-S-v
mac.x = C-S-x

# Ghostty: Wayland app id com.mitchellh.ghostty, X11 class ghostty
[ghostty]

mac.c = C-S-c
mac.v = C-S-v
mac.x = C-S-x

[com-mitchellh-ghostty]

mac.c = C-S-c
mac.v = C-S-v
mac.x = C-S-x

# VSCode overrides: Cmd+X/C/V send Ctrl+Shift for clipboard
[code*]

mac.c = C-S-c
mac.x = C-S-x
mac.v = C-S-v

[emacs*]

mac.c = C-S-c
mac.x = C-S-x
